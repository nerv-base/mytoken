# Build and test every push and pull request.
#
# The module pins both the Go version (go.mod) and MyGo (the `tool`
# directive), so the only setup a job needs is a Go toolchain. The app is
# pure Go on every platform, hence CGO_ENABLED=0 everywhere.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Concurrency:
# - Pull requests share one group per PR, so a new push to the same PR cancels
#   its stale run.
# - Every push gets its own group keyed by commit. GitHub keeps at most one
#   running and one pending run per group; a group keyed on the branch alone
#   makes a burst of merges replace the pending run, cancelling that commit
#   before any job starts and leaving it without a CI verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: 200K query benchmarks
        run: go test ./internal/query -run='^$' -bench=BenchmarkService -benchtime=1x -benchmem

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
