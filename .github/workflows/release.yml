# Tag a release: build every platform with the pinned MyGo CLI and attach the
# artifacts to a draft GitHub release.
#
# The draft is created before the builds start so that every matrix job
# uploads into the same release, which is the layout MyGo's
# docs/github-actions.md describes. The files are attached with `gh release
# upload` by one publish job once every build is done (parallel uploads of
# same-named files race), which then publishes the release.
#
# Updates: with secrets.MYGO_UPDATER_PRIVATE_KEY (`gh secret set
# MYGO_UPDATER_PRIVATE_KEY < mygo-update.key`; the public key is in
# mygo.json) each build also signs an update: the app archive, deltas from
# the versions before and update-<platform>.json. Their names are kept, as
# the manifests point at them; installed apps read the manifests of the
# latest release, so an update goes out when the release is published. The
# notes come from the version's section in CHANGELOG.md.
#
# macOS builds are signed with the Developer ID named in mygo.json and
# notarized, so this workflow needs the secrets below; the macOS job fails
# early when one is missing. docs/SIGNING.md walks through creating them
# (`scripts/macos-signing export-p12` writes the p12 for MACOS_CERTIFICATE).
# The Windows installer is still unsigned.
#
#   secrets.MACOS_CERTIFICATE           base64 .p12 signing certificate
#   secrets.MACOS_CERTIFICATE_PASSWORD  its password
#   secrets.APPLE_ID                    notarization account
#   secrets.APPLE_TEAM_ID               notarization team
#   secrets.APPLE_APP_PASSWORD          app-specific password
#   secrets.WINDOWS_CERTIFICATE         base64 .pfx, plus its password
#
# `go tool mygo build` takes the version from mygo.json, never from a flag,
# so each build job rewrites it from the tag that started the run.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    name: draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "MyToken!!!!! ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  build:
    name: ${{ matrix.name }}
    needs: draft-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    env:
      CGO_ENABLED: "0"
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      # deltas look up the published updates
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check the update-signing key
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::secrets.MYGO_UPDATER_PRIVATE_KEY is not set; installed apps would get no update"
            exit 1
          fi
      - name: Take the version from the tag
        run: go run ./scripts/setversion "$GITHUB_REF_NAME"
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Import the Developer ID certificate and notary credentials
        if: matrix.name == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::macOS builds are signed and notarized; missing secrets:$missing"
            echo "See docs/SIGNING.md for how to create them."
            exit 1
          fi
          keychain="$RUNNER_TEMP/mytoken-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # codesign must use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed 's/"//g')
          # mygo.json names only the profile, so notarytool must find it in the
          # login keychain (its default); the runner's login keychain is fresh
          # per job. The certificate can stay in the temporary keychain.
          xcrun notarytool store-credentials mytoken-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --keychain "$HOME/Library/Keychains/login.keychain-db"
      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Remove the signing keychain
        if: always() && matrix.name == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/mytoken-signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/*/*.dmg
            build/*/*.tar.gz
            build/*/*.deb
            build/*/*Setup*.exe
            build/*/install.sh
            build/*/*.delta
            build/*/update-*.json

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
      # Each platform directory carries its own installer and install.sh, and
      # a two-arch build gives them the same names, so the files are renamed
      # after their platform directory and one install.sh is kept.
      - name: Attach the files and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          version="${GITHUB_REF_NAME#v}"
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            plat="$(basename "$(dirname "$f")")"
            case "$base" in
              install.sh) [ -e out/install.sh ] || cp "$f" out/install.sh ;;
              *Setup*.exe) cp "$f" "out/mytoken-${version}-${plat}-setup.exe" ;;
              *.dmg) cp "$f" "out/mytoken-${version}-${plat}.dmg" ;;
              *) cp "$f" "out/$base" ;;
            esac
          done < <(find dist -type f -print0)
          # A build made for one Mac architecture (a local `mygo build`)
          # looks for update-darwin-arm64.json or -amd64.json; point both at
          # the universal update, or such a build never finds one.
          if [ -e out/update-darwin-universal.json ]; then
            for arch in arm64 amd64; do
              cp out/update-darwin-universal.json "out/update-darwin-${arch}.json"
            done
          fi
          ls -l out
          gh release upload "$GITHUB_REF_NAME" out/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
